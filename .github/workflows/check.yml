name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run repository checks
        # enterTest runs `check`: skill and agent validation, the dist/
        # staleness check, installer tests (POSIX and PowerShell), and
        # formatting.
        run: devenv test
